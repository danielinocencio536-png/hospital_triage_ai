name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Sobe API + Postgres
        run: |
          echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)" > .env
          docker compose up --build -d

      - name: Espera o /health
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Chama o /predict
        run: |
          curl -fs -D headers.txt -X POST http://localhost:8000/api/v1/triage/predict \
            -H "Content-Type: application/json" \
            -d '{"patient_id": "P-CI-001", "age": 78, "gender": "F", "admission_type": "EMERGENCY",
                 "length_of_stay": 9.5, "num_lab_procedures": 62, "num_medications": 21,
                 "comorbidities": {"heart_failure": true, "diabetes": true}}' | tee body.json
          echo
          grep -qi "x-audit-logged: true" headers.txt
          python3 -c "import json; b = json.load(open('body.json')); assert b['risk_category'] in ('Low', 'Moderate', 'High')"

      - name: Logs
        if: always()
        run: docker compose logs

      - run: docker compose down -v
        if: always()
